name: WT Relay CI/CD — Backend Verification & Cloud APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wt-relay-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Wrangler & Apply D1 Migrations Locally
        run: |
          npm install
          npx wrangler d1 migrations apply wt-relay-db --local

  build-android-apk:
    runs-on: ubuntu-latest
    needs: verify-backend
    defaults:
      run:
        working-directory: wt-relay-android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Build Debug & Release APK in Cloud
        run: |
          gradle assembleDebug assembleRelease --no-daemon
      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wt-relay-apk-bundle
          path: |
            wt-relay-android/app/build/outputs/apk/debug/app-debug.apk
            wt-relay-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
